# Disposable services for the pre-release verification run (scripts/ci/verify.sh).
# NOT a deployment manifest and NOT the local-dev compose file: nothing here is
# persistent (Postgres data is tmpfs), host ports are ephemeral and bound to
# loopback only (no collision with a developer's services), every credential is a
# synthetic value generated per run by the script (the `:?` guards below make a
# missing value a hard error instead of a default), and `docker compose down -v`
# in the script's cleanup removes everything. It deliberately shares nothing with
# `../docker-compose.yml` (no container names, volumes, networks or ports).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ${CI_PG_PASSWORD:?generated by scripts/ci/verify.sh}
      POSTGRES_DB: taek_ci_app
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ci -d taek_ci_app"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Isolated S3-compatible store for the real-MinIO integration suite
  # (tests/integration/product-images-minio.integration.test.ts), which creates and
  # configures its own bucket. Throwaway root credentials; no volume.
  # Built from MinIO's official source at pinned tags (./minio/Dockerfile). MinIO no longer
  # publishes prebuilt community images (quay.io/minio/* now refuses anonymous pulls), so
  # `scripts/ci/verify.sh` builds this service first with its own timeout. CI-only.
  minio:
    build:
      context: ./minio
    environment:
      MINIO_ROOT_USER: ${CI_MINIO_USER:?generated by scripts/ci/verify.sh}
      MINIO_ROOT_PASSWORD: ${CI_MINIO_PASSWORD:?generated by scripts/ci/verify.sh}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30
